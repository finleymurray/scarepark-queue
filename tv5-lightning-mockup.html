<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV5 — Tesla Coil Lightning Mockup v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
  }

  /* Lightning bolt canvas — persistent bolts that linger */
  #bolt-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 6;
    pointer-events: none;
  }

  /* Static burst canvas — TV static that explodes on lightning hit */
  #static-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    image-rendering: pixelated;
    mix-blend-mode: screen;
  }

  /* Ambient electric glow */
  #ambient-glow {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
  }

  /* Logo */
  #logo-container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
  }

  #logo-container img {
    height: 45%;
    max-width: 70%;
    object-fit: contain;
    position: relative;
  }

  /* Logo glow orb */
  #logo-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50%;
    height: 50%;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 3;
    opacity: 0;
    pointer-events: none;
  }

  /* Flash overlay */
  #flash {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
  }

  /* Vignette */
  #vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.85) 100%);
    z-index: 11;
    pointer-events: none;
  }

  /* Edge glow — like electricity hitting the frame */
  #edge-glow {
    position: absolute;
    inset: 0;
    z-index: 12;
    pointer-events: none;
    opacity: 0;
  }

  /* Info */
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    color: rgba(255,255,255,0.25);
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="bolt-canvas"></canvas>
  <canvas id="static-canvas"></canvas>
  <div id="ambient-glow"></div>
  <div id="logo-glow"></div>
  <div id="logo-container">
    <img id="logo-img" src="" alt="">
  </div>
  <div id="flash"></div>
  <div id="edge-glow"></div>
  <div id="vignette"></div>
</div>

<div id="info">TV5 Tesla Coil Mockup v2</div>

<script>
// ── Attractions ──
const ATTRACTIONS = [
  { slug: 'westlake-witch-trials', tint: '#ff1493', tintRgb: '255,20,147', name: 'Westlake Witch Trials' },
  { slug: 'the-bunker', tint: '#dc2626', tintRgb: '220,38,38', name: 'The Bunker' },
  { slug: 'drowned', tint: '#0891b2', tintRgb: '8,145,178', name: 'Drowned' },
  { slug: 'signal-loss', tint: '#22d3ee', tintRgb: '34,211,238', name: 'Signal Loss' },
  { slug: 'strings-of-control', tint: '#eab308', tintRgb: '234,179,8', name: 'Strings of Control' },
  { slug: 'night-terrors', tint: '#6b21a8', tintRgb: '107,33,168', name: 'Night Terrors' },
];

// ── Timing — slower, more deliberate ──
const HOLD_BLACK     = 800;   // Darkness builds tension
const CHARGE_UP      = 600;   // Slow electric build with 1-2 big bolts
const LOGO_DURATION  = 500;   // Each logo gets more breathing room
const FLASH_OUT      = 350;   // Final discharge
const TOTAL_DURATION = HOLD_BLACK + CHARGE_UP + (ATTRACTIONS.length * LOGO_DURATION) + FLASH_OUT + 300;

// ── DOM ──
const boltCanvas = document.getElementById('bolt-canvas');
const staticCanvas = document.getElementById('static-canvas');
const boltCtx = boltCanvas.getContext('2d');
const staticCtx = staticCanvas.getContext('2d');
const ambientGlow = document.getElementById('ambient-glow');
const logoGlow = document.getElementById('logo-glow');
const logoContainer = document.getElementById('logo-container');
const logoImg = document.getElementById('logo-img');
const flash = document.getElementById('flash');
const edgeGlow = document.getElementById('edge-glow');

// Canvas sizing
function resize() {
  boltCanvas.width = window.innerWidth;
  boltCanvas.height = window.innerHeight;
  // Static canvas is low-res for chunky pixel look
  staticCanvas.width = 320;
  staticCanvas.height = 180;
}
resize();
window.addEventListener('resize', resize);

// Preload
ATTRACTIONS.forEach(a => { const img = new Image(); img.src = `logos/${a.slug}.webp`; });

// ══════════════════════════════════════════
// TESLA COIL LIGHTNING — thick, branching, lingering
// ══════════════════════════════════════════

function generateBoltPath(x1, y1, x2, y2, segments, jitter) {
  const points = [{ x: x1, y: y1 }];
  const dx = x2 - x1;
  const dy = y2 - y1;
  for (let i = 1; i < segments; i++) {
    const t = i / segments;
    // More jitter in the middle of the bolt
    const midFactor = 1 - Math.abs(t - 0.5) * 1.5;
    const j = jitter * (0.5 + midFactor);
    points.push({
      x: x1 + dx * t + (Math.random() - 0.5) * j,
      y: y1 + dy * t + (Math.random() - 0.5) * j * 0.4,
    });
  }
  points.push({ x: x2, y: y2 });
  return points;
}

function drawBoltPath(ctx, points, width, glowSize, color, coreOpacity) {
  // Wide outer glow
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.strokeStyle = color.replace('COLOR_A', '0.08');
  ctx.lineWidth = width + glowSize * 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = color.replace('COLOR_A', '0.4');
  ctx.shadowBlur = glowSize * 1.5;
  ctx.stroke();

  // Inner glow
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.strokeStyle = color.replace('COLOR_A', '0.35');
  ctx.lineWidth = width + glowSize * 0.5;
  ctx.shadowBlur = glowSize * 0.6;
  ctx.stroke();

  // Bright core
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.strokeStyle = `rgba(255,255,255,${coreOpacity})`;
  ctx.lineWidth = width;
  ctx.shadowColor = color.replace('COLOR_A', '0.9');
  ctx.shadowBlur = 12;
  ctx.stroke();
}

// Draw a full tesla bolt with branches
function drawTeslaBolt(ctx, x1, y1, x2, y2, opts = {}) {
  const {
    segments = 16,
    jitter = 80,
    width = 3.5,
    glowSize = 35,
    colorBase = '180,220,255',
    branchChance = 0.4,
    branchDepth = 2,
    opacity = 1,
  } = opts;

  const color = `rgba(${colorBase},COLOR_A)`;

  ctx.save();
  ctx.globalAlpha = opacity;

  const mainPath = generateBoltPath(x1, y1, x2, y2, segments, jitter);
  drawBoltPath(ctx, mainPath, width, glowSize, color, 0.95);

  // Branches — bigger and fewer than before
  if (branchDepth > 0) {
    for (let i = 3; i < mainPath.length - 2; i++) {
      if (Math.random() < branchChance) {
        const p = mainPath[i];
        const angle = Math.atan2(y2 - y1, x2 - x1) + (Math.random() - 0.5) * Math.PI * 0.8;
        const len = (80 + Math.random() * 120) * (branchDepth / 2);
        const bx = p.x + Math.cos(angle) * len;
        const by = p.y + Math.sin(angle) * len;

        const branchPath = generateBoltPath(p.x, p.y, bx, by, 5 + Math.floor(Math.random() * 4), jitter * 0.5);
        drawBoltPath(ctx, branchPath, width * 0.5, glowSize * 0.4, color, 0.6);

        // Sub-branches
        if (branchDepth > 1 && Math.random() < 0.3) {
          const sp = branchPath[Math.floor(branchPath.length * 0.6)];
          const sa = angle + (Math.random() - 0.5) * 1.2;
          const sl = 40 + Math.random() * 60;
          const subPath = generateBoltPath(sp.x, sp.y, sp.x + Math.cos(sa) * sl, sp.y + Math.sin(sa) * sl, 3, jitter * 0.3);
          drawBoltPath(ctx, subPath, width * 0.3, glowSize * 0.2, color, 0.35);
        }
      }
    }
  }

  ctx.restore();
}

// ══════════════════════════════════════════
// STATIC BURST — chunky TV static that explodes on impact
// ══════════════════════════════════════════

let staticIntensity = 0;
let staticTint = null; // null = white static, or [r,g,b] for tinted

function drawStaticBurst() {
  if (staticIntensity <= 0) {
    staticCtx.clearRect(0, 0, 320, 180);
    return;
  }

  const imageData = staticCtx.createImageData(320, 180);
  const d = imageData.data;
  const intensity = staticIntensity;

  for (let i = 0; i < d.length; i += 4) {
    if (Math.random() > intensity) {
      d[i + 3] = 0; // Transparent — most pixels are black
      continue;
    }
    const v = 100 + Math.random() * 155;
    if (staticTint) {
      // Tinted static
      d[i]     = v * (staticTint[0] / 255) * 0.7 + v * 0.3;
      d[i + 1] = v * (staticTint[1] / 255) * 0.7 + v * 0.3;
      d[i + 2] = v * (staticTint[2] / 255) * 0.7 + v * 0.3;
    } else {
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    d[i + 3] = Math.floor(40 + Math.random() * 160 * intensity);
  }
  staticCtx.putImageData(imageData, 0, 0);
}

// Fire a static burst that decays over time
function fireStaticBurst(peakIntensity, decayMs, tintRgb) {
  staticIntensity = peakIntensity;
  if (tintRgb) {
    const parts = tintRgb.split(',').map(Number);
    staticTint = parts;
  } else {
    staticTint = null;
  }

  const startTime = performance.now();
  function decay() {
    const elapsed = performance.now() - startTime;
    const progress = Math.min(elapsed / decayMs, 1);
    // Fast initial decay, long tail
    staticIntensity = peakIntensity * Math.pow(1 - progress, 2);
    if (progress < 1) requestAnimationFrame(decay);
    else staticIntensity = 0;
  }
  requestAnimationFrame(decay);
}

// ══════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════

// Bolt queue — bolts linger and fade
let activeBolts = []; // { x1,y1,x2,y2, opts, born, lifespan, fadeStart }

function queueBolt(x1, y1, x2, y2, opts, lifespan = 200) {
  activeBolts.push({
    x1, y1, x2, y2, opts,
    born: performance.now(),
    lifespan,
    // Each bolt re-generates its path a few times while alive for that "crackling" look
    pathSeed: Math.random(),
  });
}

let phase = 'black'; // black, charge, logo, flash
let currentColorBase = '180,220,255';
let currentTintRgb = '100,180,255';

function renderLoop() {
  const now = performance.now();
  const w = boltCanvas.width;
  const h = boltCanvas.height;
  const cx = w / 2;
  const cy = h / 2;

  // Clear bolt canvas
  boltCtx.clearRect(0, 0, w, h);

  // Draw active bolts (with fade)
  activeBolts = activeBolts.filter(b => {
    const age = now - b.born;
    if (age > b.lifespan) return false;

    const fadeProgress = age / b.lifespan;
    // Bolts are full brightness for 40% of life, then fade
    const opacity = fadeProgress < 0.4 ? 1 : 1 - ((fadeProgress - 0.4) / 0.6);

    // Re-jitter the path slightly each frame for crackle effect
    const jitterMult = 0.7 + Math.random() * 0.6;
    drawTeslaBolt(boltCtx, b.x1, b.y1, b.x2, b.y2, {
      ...b.opts,
      jitter: (b.opts.jitter || 80) * jitterMult,
      opacity: opacity * (b.opts.opacity || 1),
    });
    return true;
  });

  // Draw static
  drawStaticBurst();

  // ── Charge phase: occasional big bolts from edges to centre ──
  if (phase === 'charge') {
    if (Math.random() < 0.06) { // Much less frequent — big deliberate strikes
      const side = Math.floor(Math.random() * 4);
      let sx, sy;
      switch (side) {
        case 0: sx = Math.random() * w; sy = -30; break;
        case 1: sx = w + 30; sy = Math.random() * h; break;
        case 2: sx = Math.random() * w; sy = h + 30; break;
        default: sx = -30; sy = Math.random() * h; break;
      }
      const tx = cx + (Math.random() - 0.5) * w * 0.2;
      const ty = cy + (Math.random() - 0.5) * h * 0.2;

      queueBolt(sx, sy, tx, ty, {
        segments: 18,
        jitter: 100,
        width: 3 + Math.random() * 2,
        glowSize: 40,
        colorBase: currentColorBase,
        branchChance: 0.45,
        branchDepth: 2,
      }, 300 + Math.random() * 200);

      // Static burst on impact
      fireStaticBurst(0.5 + Math.random() * 0.3, 250, currentTintRgb);

      // Edge glow pulse
      edgeGlow.style.boxShadow = `inset 0 0 100px rgba(${currentTintRgb},0.25), inset 0 0 250px rgba(${currentTintRgb},0.08)`;
      edgeGlow.style.opacity = 0.6;
      setTimeout(() => { edgeGlow.style.opacity = 0.1; }, 150);
    }
  }

  // ── Logo phase: big strikes converge on centre when logo appears ──
  if (phase === 'logo') {
    // Occasional massive bolt — the "tesla coil zap"
    if (Math.random() < 0.04) {
      const side = Math.floor(Math.random() * 4);
      let sx, sy;
      switch (side) {
        case 0: sx = Math.random() * w; sy = -30; break;
        case 1: sx = w + 30; sy = Math.random() * h; break;
        case 2: sx = Math.random() * w; sy = h + 30; break;
        default: sx = -30; sy = Math.random() * h; break;
      }
      const tx = cx + (Math.random() - 0.5) * w * 0.1;
      const ty = cy + (Math.random() - 0.5) * h * 0.1;

      queueBolt(sx, sy, tx, ty, {
        segments: 20,
        jitter: 90,
        width: 4 + Math.random() * 2,
        glowSize: 45,
        colorBase: currentColorBase,
        branchChance: 0.5,
        branchDepth: 2,
      }, 350 + Math.random() * 200);

      // Big static burst on hit
      fireStaticBurst(0.7 + Math.random() * 0.3, 350, currentTintRgb);

      // Logo shake on big hit
      logoContainer.style.transform = `translate(${(Math.random()-0.5)*6}px, ${(Math.random()-0.5)*4}px)`;
      setTimeout(() => { logoContainer.style.transform = 'translate(0,0)'; }, 80);

      // Edge flash
      edgeGlow.style.opacity = 0.7;
      setTimeout(() => { edgeGlow.style.opacity = 0.15; }, 120);
    }
  }

  requestAnimationFrame(renderLoop);
}

// ══════════════════════════════════════════
// MAIN SEQUENCE — slower, more deliberate
// ══════════════════════════════════════════

function runSequence() {
  let t = 0;
  const w = boltCanvas.width;
  const h = boltCanvas.height;
  const cx = w / 2;
  const cy = h / 2;

  // Reset everything
  phase = 'black';
  logoContainer.style.opacity = 0;
  flash.style.opacity = 0;
  ambientGlow.style.opacity = 0;
  edgeGlow.style.opacity = 0;
  logoGlow.style.opacity = 0;
  staticIntensity = 0;
  activeBolts = [];
  currentColorBase = '180,220,255';
  currentTintRgb = '100,180,255';

  // ═══ Phase 1: Darkness (0 → HOLD_BLACK) ═══
  // Pure black. Silence. Tension.

  // ═══ Phase 2: Electric charge (HOLD_BLACK → HOLD_BLACK + CHARGE_UP) ═══
  // A couple of big tesla bolts crack across the screen with static bursts
  setTimeout(() => {
    phase = 'charge';
    ambientGlow.style.background = 'radial-gradient(ellipse at center, rgba(100,180,255,0.06) 0%, transparent 60%)';
    ambientGlow.style.opacity = 0.4;

    // First big deliberate bolt — top to centre
    setTimeout(() => {
      const sx = w * 0.3 + Math.random() * w * 0.4;
      queueBolt(sx, -30, cx + (Math.random()-0.5)*100, cy + (Math.random()-0.5)*80, {
        segments: 20, jitter: 100, width: 4, glowSize: 50,
        colorBase: '180,220,255', branchChance: 0.5, branchDepth: 2,
      }, 400);
      fireStaticBurst(0.8, 400, '180,220,255');
      edgeGlow.style.boxShadow = 'inset 0 0 100px rgba(100,180,255,0.3), inset 0 0 250px rgba(100,180,255,0.1)';
      edgeGlow.style.opacity = 0.6;
      ambientGlow.style.opacity = 0.7;
      setTimeout(() => { edgeGlow.style.opacity = 0.15; ambientGlow.style.opacity = 0.3; }, 200);
    }, 100);

    // Second bolt from side
    setTimeout(() => {
      queueBolt(-30, h * 0.3 + Math.random() * h * 0.4, cx + (Math.random()-0.5)*80, cy + (Math.random()-0.5)*60, {
        segments: 18, jitter: 90, width: 3.5, glowSize: 40,
        colorBase: '180,220,255', branchChance: 0.45, branchDepth: 2,
      }, 350);
      fireStaticBurst(0.6, 300, '180,220,255');
      edgeGlow.style.opacity = 0.5;
      setTimeout(() => { edgeGlow.style.opacity = 0.1; }, 180);
    }, 350);

  }, HOLD_BLACK);
  t = HOLD_BLACK;

  // ═══ Phase 3: Logo reveals — each introduced by a massive lightning strike ═══
  t += CHARGE_UP;
  ATTRACTIONS.forEach((attraction, i) => {
    const logoStart = t + i * LOGO_DURATION;

    // BIG STRIKE that reveals the logo
    setTimeout(() => {
      phase = 'logo';
      currentColorBase = attraction.tintRgb;
      currentTintRgb = attraction.tintRgb;

      // Fire 2-3 massive bolts converging on centre simultaneously
      const boltCount = 2 + Math.floor(Math.random() * 2);
      for (let b = 0; b < boltCount; b++) {
        const side = (i + b) % 4;
        let sx, sy;
        switch (side) {
          case 0: sx = Math.random() * w; sy = -30; break;
          case 1: sx = w + 30; sy = Math.random() * h; break;
          case 2: sx = Math.random() * w; sy = h + 30; break;
          default: sx = -30; sy = Math.random() * h; break;
        }
        queueBolt(sx, sy, cx + (Math.random()-0.5)*60, cy + (Math.random()-0.5)*40, {
          segments: 22,
          jitter: 80 + Math.random() * 40,
          width: 4 + Math.random() * 2,
          glowSize: 45 + Math.random() * 15,
          colorBase: attraction.tintRgb,
          branchChance: 0.5,
          branchDepth: 2,
        }, 400 + Math.random() * 150);
      }

      // Massive static burst on impact
      fireStaticBurst(0.9, 400, attraction.tintRgb);

      // Show logo — snaps in hard
      logoImg.src = `logos/${attraction.slug}.webp`;
      logoImg.alt = attraction.name;
      logoImg.style.filter = `drop-shadow(0 0 40px ${attraction.tint}) drop-shadow(0 0 80px rgba(${attraction.tintRgb},0.5))`;
      logoContainer.style.opacity = 1;
      logoContainer.style.transform = `scale(1.06) translate(${(Math.random()-0.5)*6}px, ${(Math.random()-0.5)*3}px)`;
      setTimeout(() => { logoContainer.style.transform = 'scale(1) translate(0,0)'; }, 70);

      // Logo glow
      logoGlow.style.background = `radial-gradient(ellipse at center, rgba(${attraction.tintRgb},0.3) 0%, rgba(${attraction.tintRgb},0.1) 40%, transparent 65%)`;
      logoGlow.style.opacity = 1;

      // Ambient glow
      ambientGlow.style.background = `radial-gradient(ellipse at center, rgba(${attraction.tintRgb},0.1) 0%, transparent 65%)`;
      ambientGlow.style.opacity = 0.8;

      // Edge glow with attraction tint
      edgeGlow.style.boxShadow = `inset 0 0 100px rgba(${attraction.tintRgb},0.35), inset 0 0 250px rgba(${attraction.tintRgb},0.1)`;
      edgeGlow.style.opacity = 0.7;
      setTimeout(() => { edgeGlow.style.opacity = 0.2; }, 200);

      // Quick bright flash on transition
      flash.style.background = `rgba(${attraction.tintRgb},0.3)`;
      flash.style.opacity = 0.5;
      setTimeout(() => { flash.style.opacity = 0; }, 80);

    }, logoStart);

    // Mid-logo: another deliberate zap + static burst (not frantic — just one hit)
    setTimeout(() => {
      const side = Math.floor(Math.random() * 4);
      let sx, sy;
      switch (side) {
        case 0: sx = Math.random() * w; sy = -30; break;
        case 1: sx = w + 30; sy = Math.random() * h; break;
        case 2: sx = Math.random() * w; sy = h + 30; break;
        default: sx = -30; sy = Math.random() * h; break;
      }
      queueBolt(sx, sy, cx + (Math.random()-0.5)*80, cy + (Math.random()-0.5)*60, {
        segments: 16, jitter: 70, width: 3, glowSize: 35,
        colorBase: attraction.tintRgb, branchChance: 0.4, branchDepth: 1,
      }, 300);
      fireStaticBurst(0.5, 250, attraction.tintRgb);

      // Subtle logo nudge
      logoContainer.style.transform = `translate(${(Math.random()-0.5)*4}px, ${(Math.random()-0.5)*3}px)`;
      setTimeout(() => { logoContainer.style.transform = 'translate(0,0)'; }, 60);

      edgeGlow.style.opacity = 0.5;
      setTimeout(() => { edgeGlow.style.opacity = 0.15; }, 150);
    }, logoStart + LOGO_DURATION * 0.6);
  });

  // ═══ Phase 4: Final discharge — massive white-out ═══
  const flashStart = t + ATTRACTIONS.length * LOGO_DURATION;
  setTimeout(() => {
    phase = 'flash';

    // Fire bolts from every edge
    for (let b = 0; b < 5; b++) {
      const side = b % 4;
      let sx, sy;
      switch (side) {
        case 0: sx = Math.random() * w; sy = -30; break;
        case 1: sx = w + 30; sy = Math.random() * h; break;
        case 2: sx = Math.random() * w; sy = h + 30; break;
        default: sx = -30; sy = Math.random() * h; break;
      }
      queueBolt(sx, sy, cx + (Math.random()-0.5)*100, cy + (Math.random()-0.5)*80, {
        segments: 22, jitter: 120, width: 5, glowSize: 60,
        colorBase: '220,240,255', branchChance: 0.6, branchDepth: 2,
      }, 300);
    }

    // Huge static burst
    fireStaticBurst(1.0, 500, null);

    // White flash
    flash.style.background = '#fff';
    flash.style.opacity = 0.9;
    edgeGlow.style.boxShadow = 'inset 0 0 150px rgba(255,255,255,0.5), inset 0 0 300px rgba(180,220,255,0.2)';
    edgeGlow.style.opacity = 1;

    setTimeout(() => { flash.style.opacity = 0.4; }, 80);
    setTimeout(() => { flash.style.opacity = 0.15; }, 160);
    setTimeout(() => {
      flash.style.opacity = 0;
      edgeGlow.style.opacity = 0;
      ambientGlow.style.opacity = 0;
      logoContainer.style.opacity = 0;
      logoGlow.style.opacity = 0;
      phase = 'black';
      staticIntensity = 0;
    }, FLASH_OUT);
  }, flashStart);

  // Loop
  setTimeout(runSequence, TOTAL_DURATION);
}

// ── Go ──
requestAnimationFrame(renderLoop);
runSequence();
</script>
