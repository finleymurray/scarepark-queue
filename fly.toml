# Fly.io config for an always-on London test of CoreLink.
# Live data still goes straight from the browser to Supabase (London);
# this machine only serves the page files.
app = "corelink-queue"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_SUPABASE_URL = "https://eugqphnpqvqubusqemgv.supabase.co"
  # Publishable key: safe in the browser, access is enforced by row level security.
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_NJW0spa0CgrK1E5U8h40-A_-rxDzjOr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
