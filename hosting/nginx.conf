# Serves the static export of CoreLink. Routes map to the .html files
# Next.js writes (/tv -> tv.html, /queue/drowned -> queue/drowned.html).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Hashed build assets never change, so browsers and Pis can keep them.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Liveness check for Fly.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    # Pages always revalidate so a deploy shows up on the next load.
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
